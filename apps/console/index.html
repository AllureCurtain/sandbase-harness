<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Cpath d='M9 22V10l7 7 7-7v12' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>managed-agents Dashboard</title>
    <script>
      ;(() => {
        const stored = localStorage.getItem("sandbase-console.theme")
        const preference =
          stored === "light" || stored === "dark" || stored === "system" ? stored : "system"
        const resolved =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference
        document.documentElement.dataset.theme = resolved
        document.documentElement.classList.toggle("dark", resolved === "dark")
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
